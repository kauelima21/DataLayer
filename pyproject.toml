[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiodatalayer"
version = "2.3.0"
description = "ORM async minimalista (ActiveRecord) para MariaDB/MySQL e PostgreSQL — inspirado no DataLayer PHP de Robson V. Leite."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kaue Leal", email = "kaue.lima@totvs.com.br" },
]
keywords = [
    "orm",
    "active-record",
    "async",
    "asyncio",
    "mariadb",
    "mysql",
    "postgresql",
    "postgres",
    "asyncpg",
    "asyncmy",
    "datalayer",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "asyncmy>=0.2.9",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/kaueleal/aiodatalayer"
Repository = "https://github.com/kaueleal/aiodatalayer"
Issues = "https://github.com/kaueleal/aiodatalayer/issues"
Changelog = "https://github.com/kaueleal/aiodatalayer/releases"

[tool.hatch.version]
path = "datalayer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["datalayer"]

[tool.hatch.build.targets.sdist]
include = [
    "/datalayer",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
